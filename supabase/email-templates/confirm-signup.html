<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Konfirmasi akun StudyFlow</title>
  </head>
  <body style="margin:0;padding:0;background-color:#FDF6E9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FDF6E9;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
            <tr>
              <td style="background-color:#111111;padding:0 8px 8px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FFFFFF;border:4px solid #111111;">
                  <tr>
                    <td style="padding:28px 24px 32px 24px;font-family:Arial,Helvetica,sans-serif;color:#111111;">
                      <div style="width:72px;height:10px;background-color:#7CC142;border:3px solid #111111;"></div>

                      <h1 style="margin:16px 0 0 0;font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:32px;line-height:0.95;letter-spacing:-0.5px;color:#111111;text-transform:uppercase;">
                        StudyFlow
                      </h1>
                      <div style="width:168px;height:4px;background-color:#111111;margin-top:8px;"></div>

                      <p style="margin:20px 0 0 0;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#111111;">
                        Konfirmasi akun
                      </p>

                      <p style="margin:12px 0 0 0;font-size:16px;line-height:1.5;font-weight:700;color:#111111;">
                        Satu ketuk lagi supaya
                        <span style="background-color:#FFD23F;border:3px solid #111111;padding:2px 6px;display:inline-block;">{{ .Email }}</span>
                        bisa mulai catat tugas.
                      </p>

                      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 0 0;">
                        <tr>
                          <td style="background-color:#111111;padding:0 6px 6px 0;">
                            <a
                              href="{{ .ConfirmationURL }}"
                              target="_blank"
                              style="display:inline-block;background-color:#FF5A1F;border:3px solid #111111;color:#111111;font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;letter-spacing:0.5px;text-decoration:none;text-transform:uppercase;padding:14px 24px;"
                            >
                              Konfirmasi email
                            </a>
                          </td>
                        </tr>
                      </table>

                      <p style="margin:24px 0 0 0;font-size:12px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#111111;">
                        Tombol tidak bisa diklik? Salin tautan ini:
                      </p>
                      <p style="margin:8px 0 0 0;font-size:13px;line-height:1.5;word-break:break-all;color:#111111;">
                        {{ .ConfirmationURL }}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 4px 0 4px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.4;color:#111111;">
                StudyFlow — manajemen tugas kuliah. Email ini dikirim otomatis, jangan dibalas.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
